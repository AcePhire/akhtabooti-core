[package]
name = "akhtabooti-core"
version = "0.1.0"
edition = "2024"
description = "Scanning library for detecting PIIs within documents, PDFs, and images"
license = "Apache-2.0"

[dependencies]
extractous = "0.3.0"
image = "0.25.10"
infer = "0.22.0"
libc = "0.2.189"
ocr-rs = "2.4.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
walkdir = "2.5.0"
